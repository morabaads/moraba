<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>کوچ | بندانگشتی</title><style>
@font-face{font-family:Dana;src:url(DanaVF.ttf);font-weight:100 1000}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Dana,Tahoma,sans-serif}
.s{width:320px;height:320px;position:relative;overflow:hidden;background:radial-gradient(260px 220px at 50% 60%,rgba(255,90,31,.22),transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 2px,transparent 2px 18px),#14110e;text-align:center}
.frame{position:absolute;inset:10px;border:1.5px solid rgba(255,255,255,.12);border-radius:26px}
.wp{position:absolute;top:22px;right:22px;background:linear-gradient(135deg,#ff9a3d,#ff5a1f);color:#fff;font-family:Arial Black,Arial,sans-serif;font-weight:900;font-size:20px;padding:4px 12px;border-radius:10px;box-shadow:0 6px 18px rgba(255,90,31,.5)}

h1{position:absolute;top:86px;left:0;right:0;font-size:112px;font-weight:950;line-height:1.1;color:#fff;text-shadow:0 1px 0 #ddd,0 2px 0 #c6c6c6,0 3px 0 #b0b0b0,0 4px 0 #999,0 12px 24px rgba(0,0,0,.6)}
.sub{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(90deg,#ff9a3d,#ff5a1f);color:#fff;font-weight:900;font-size:21px;padding:4px 20px 6px;border-radius:10px 24px 10px 24px}
</style></head><body><div class="s"><div class="frame"></div><div class="wp">WP</div><div class="en">KOOCH</div><h1>کوچ</h1><div class="sub">افزونه انتقال محصول</div></div></body></html>
