<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>کوچ | بندانگشتی</title>
<style>
@font-face{font-family:Dana;src:url(DanaVF.ttf);font-weight:100 1000}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Dana,Tahoma,sans-serif}
.s{width:320px;height:320px;position:relative;overflow:hidden;background:
 radial-gradient(220px 200px at 50% 38%,rgba(255,90,31,.55),transparent 70%),
 radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px) 0 0/14px 14px,#0b0907;text-align:center}
.ring{position:absolute;left:50%;top:14px;width:176px;height:176px;margin-left:-88px;border-radius:50%;border:1.5px dashed rgba(255,160,100,.45)}
.core{position:absolute;left:50%;top:36px;width:132px;height:132px;margin-left:-66px;border-radius:38px;background:linear-gradient(145deg,#ffb87a,#ff5a1f 58%,#d63a06);display:grid;place-items:center;box-shadow:0 0 50px rgba(255,90,31,.8),inset 0 4px 14px rgba(255,255,255,.45);transform:rotate(-8deg)}
.core img{width:84px;filter:brightness(0) invert(1) drop-shadow(0 5px 8px rgba(0,0,0,.3))}
h1{position:absolute;top:176px;left:0;right:0;font-size:64px;font-weight:950;line-height:1.1;color:#fff7f0;text-shadow:0 1px 0 #ffc39a,0 2px 0 #ff9a55,0 3px 0 #f97a30,0 4px 0 #e05a15,0 10px 24px rgba(255,90,31,.5)}
.sub{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;font-weight:800;color:#ffd9bf;background:rgba(255,90,31,.16);border:1px solid rgba(255,138,61,.5);padding:3px 14px;border-radius:99px}
</style></head><body>
<div class="s"><div class="ring"></div><div class="core"><img src="kooch-icon.png" alt=""></div><h1>کوچ</h1><div class="sub">انتقال هوشمند محصولات</div></div>
</body></html>
