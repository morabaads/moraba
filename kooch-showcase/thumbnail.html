<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>کوچ | تامنیل</title>
<style>
@font-face{font-family:Dana;src:url(DanaVF.ttf);font-weight:100 1000}
:root{--o:#ff5a1f;--o2:#ff8a3d;--bg:#0b0907;--tx:#fff7f0;--mu:#a89f91;--ok:#22c56b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Dana,Tahoma,sans-serif;color:var(--tx)}
.i{width:1.15em;height:1.15em;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.t{width:1050px;height:520px;position:relative;overflow:hidden;background:
 radial-gradient(600px 300px at 50% -60px,rgba(255,90,31,.45),transparent 70%),
 radial-gradient(520px 320px at 50% 115%,rgba(255,90,31,.55),transparent 70%),
 radial-gradient(rgba(255,255,255,.06) 1.2px,transparent 1.4px) 0 0/22px 22px,var(--bg)}
.head{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px}
h1{font-size:112px;font-weight:950;line-height:1.1;letter-spacing:-2px;color:var(--tx);text-shadow:0 1px 0 #ffc39a,0 2px 0 #ffa86b,0 3px 0 #ff9048,0 4px 0 #f97a30,0 5px 0 #ec641d,0 6px 0 #dc5212,0 18px 40px rgba(255,90,31,.5)}
.badge{background:linear-gradient(135deg,#ffa05a,var(--o));color:#fff;font-weight:900;font-size:30px;padding:8px 26px 10px;border-radius:20px;transform:rotate(-8deg) translateY(-8px);box-shadow:0 14px 40px rgba(255,90,31,.6),inset 0 2px 0 rgba(255,255,255,.35)}
.sub{position:absolute;top:160px;left:0;right:0;text-align:center;font-size:24px;font-weight:800;color:#f1e9df}
.sub b{color:var(--o2)}
.pills{position:absolute;top:212px;left:34px;right:34px;display:flex;gap:14px}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.13);font-size:17px;font-weight:800;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.pill .i{color:var(--o2);width:22px;height:22px}
.p{position:absolute;top:300px;height:260px;border-radius:26px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.dark{left:50px;width:420px;border:1px solid #3d3328;transform:rotate(-3deg)}
.light{right:50px;width:420px;transform:rotate(3deg)}
.bar{display:flex;gap:6px;align-items:center;padding:12px 18px;border-bottom:1px solid #2e261d;font-size:13px;color:var(--mu);font-weight:700}
.bar i{width:10px;height:10px;border-radius:50%;background:#3a3126}.bar i:first-child{background:var(--o)}.bar b{margin-inline-start:auto}
.prod{display:flex;gap:16px;align-items:center;padding:20px 20px 14px}
.im{width:84px;height:84px;border-radius:20px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--o2),var(--o));color:#fff;box-shadow:0 10px 26px rgba(255,90,31,.45)}
.im .i{width:40px;height:40px;stroke-width:1.7}
.nm{font-size:19px;font-weight:900}.pr{font-size:24px;font-weight:950;color:#3ddc84;margin-top:6px}
.ok{margin:0 20px;display:flex;gap:8px}
.ok span{font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:rgba(61,220,132,.13);color:#3ddc84}
.light h3{font-size:24px;font-weight:900}
.in{margin-top:16px;background:#fff;border:1.5px solid #eadfcf;border-radius:14px;padding:14px 16px;color:#8a7f70;font-size:15px;direction:ltr;text-align:left}
.cta{margin-top:14px;text-align:center;background:linear-gradient(135deg,#ffa05a,var(--o));color:#fff;font-weight:900;padding:12px;border-radius:14px;font-size:17px;box-shadow:0 10px 24px rgba(255,90,31,.4)}
.core{position:absolute;left:50%;top:318px;margin-left:-72px;width:144px;height:144px;border-radius:40px;background:linear-gradient(145deg,#ffb87a,var(--o) 58%,#d63a06);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(11,9,7,.9),0 0 40px rgba(255,90,31,.7),inset 0 5px 18px rgba(255,255,255,.45);transform:rotate(-8deg);z-index:5}
.core img{width:92px;filter:brightness(0) invert(1) drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.halo{position:absolute;left:50%;top:390px;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,90,31,.75),rgba(255,90,31,.25) 50%,transparent);z-index:3}
.arr{position:absolute;top:382px;z-index:4;color:#ffb07a;font-size:28px;font-weight:900;text-shadow:0 0 14px var(--o)}
</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol><symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></symbol><symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol><symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol><symbol id="i-coins" viewBox="0 0 24 24"><circle cx="8" cy="8" r="6"/><path d="M18.1 10.4A6 6 0 1 1 10.4 18.1M7 6h1v4"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-15.5-6.3L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.3L21 16"/><path d="M16 16h5v5"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol><symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></symbol><symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol><symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol><symbol id="i-hook" viewBox="0 0 24 24"><circle cx="12" cy="5" r="3"/><path d="M12 8v5a4 4 0 0 0 8 0M20 13h-3"/><circle cx="5" cy="17" r="3"/><path d="M5 14c0-3 3-6 7-6"/></symbol><symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.7 1.8L21.5 17.5l-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol><symbol id="i-lang" viewBox="0 0 24 24"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></symbol></svg>

<div class="t">
 <div class="head"><h1>کوچ</h1><div class="badge">افزونه ووکامرس</div></div>
 <div class="sub">انتقال و همگام‌سازی <b>خودکار</b> محصولات</div>
 <div class="pills">
  <div class="pill"><svg class="i"><use href="#i-refresh"/></svg>همگام‌سازی قیمت و موجودی</div>
  <div class="pill"><svg class="i"><use href="#i-eye"/></svg>پیش‌نمایش قبل از انتقال</div>
  <div class="pill"><svg class="i"><use href="#i-undo"/></svg>بازگردانی با یک کلیک</div>
  <div class="pill"><svg class="i"><use href="#i-lang"/></svg>فارسی، ریال و تومان</div>
 </div>
 <div class="p light" style="background:#fff url(screenshots/s6_preview.png) no-repeat;background-size:664.1px auto;background-position:-195.9px -140.3px"></div>
 <div class="p dark" style="background:#fff url(screenshots/s7_run.png) no-repeat;background-size:640.0px auto;background-position:-110.0px -62.5px"></div>
